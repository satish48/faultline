[variables]
LD_LIBRARY_PATH="/nix/store:/usr/lib:/lib"

[phases.setup]
nixPkgs = [
  "python311",
  "python311Packages.pip",
  "gcc-unwrapped",
  "stdenv.cc.cc",
]

[phases.install]
cmds = [
  "python -m venv /opt/venv",
  ". /opt/venv/bin/activate && pip install --upgrade pip setuptools wheel",
  ". /opt/venv/bin/activate && pip install --no-cache-dir -r agentwatch/requirements.txt"
]

[start]
cmd = ". /opt/venv/bin/activate && uvicorn agentwatch.api.main:app --host 0.0.0.0 --port $PORT"