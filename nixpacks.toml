[phases.setup]
nixPkgs = ["python311", "python311Packages.pip"]

[phases.install]
cmds = [
  "python -m venv /opt/venv",
  ". /opt/venv/bin/activate && pip install --upgrade pip",
  ". /opt/venv/bin/activate && pip install -r agentwatch/requirements.txt"
]

[start]
cmd = ". /opt/venv/bin/activate && python -m uvicorn agentwatch.api.main:app --host 0.0.0.0 --port $PORT"
