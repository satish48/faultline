[phases.setup]
nixPkgs = [
  "python311",
  "python311Packages.pip",
  "stdenv.cc.cc.lib"
]

[phases.install]
cmds = [
  "python -m venv /opt/venv",
  ". /opt/venv/bin/activate && pip install --upgrade pip",
  ". /opt/venv/bin/activate && pip install -r agentwatch/requirements.txt"
]

[start]
cmd = "LD_LIBRARY_PATH=/nix/store/*-gcc-*/lib:$LD_LIBRARY_PATH . /opt/venv/bin/activate && python -m uvicorn agentwatch.api.main:app --host 0.0.0.0 --port $PORT"